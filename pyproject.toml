[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparql-tool"
version = "0.2.1"
description = "CLI tool for querying SPARQL endpoints"
readme = "README.md"
authors = [
  {name = "Vlad Korolev", email = "vlad@v-lad.org"}
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
  "typer>=0.9.0",
  "httpx>=0.25.0",
  "pydantic>=2.5.0",
  "rich>=13.0.0",
  "structlog>=23.2.0",
  "sentry-sdk>=1.40.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "mypy>=1.7.0",
  "ruff>=0.1.0"
]

[project.scripts]
sparql = "sparql.cli.main:app"

[project.urls]
Homepage = "https://github.com/vladistan/sparql-tool"
Repository = "https://github.com/vladistan/sparql-tool"
Issues = "https://github.com/vladistan/sparql-tool/issues"

[tool.hatch.build.targets.wheel]
packages = ["sparql"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=sparql --cov-report=term-missing"
markers = [
  "integration: marks tests as integration tests (deselect with '-m \"not integration\"')"
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP" # pyupgrade
]
